<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>تفاصيل الخبر | موقع الجمل</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body>
  <header class="site-header compact">
    <div class="container header-inner">
      <a class="back-link" href="index.html">← العودة للرئيسية</a>

      <div class="brand small">
        <div class="logo" aria-label="شعار الجمل">
          <svg viewBox="0 0 64 64" width="34" height="34" role="img" aria-hidden="true">
            <defs>
              <linearGradient id="g2" x1="0" x2="1">
                <stop offset="0" stop-color="rgba(56,189,248,0.95)"/>
                <stop offset="1" stop-color="rgba(34,197,94,0.95)"/>
              </linearGradient>
            </defs>
            <path fill="url(#g2)" d="M20 34c2-7 7-14 14-14 6 0 10 5 11 10 4 0 7 3 7 7 0 4-3 7-7 7H18c-4 0-7-3-7-7 0-4 3-7 7-7 0-1 1-2 2-3z"/>
            <path fill="rgba(233,238,252,0.92)" d="M24 31c1-4 5-9 10-9 4 0 7 3 8 7-5 0-10 2-12 7h-6z"/>
            <circle cx="39.5" cy="30.5" r="1.5" fill="rgba(11,18,32,0.9)"/>
          </svg>
        </div>

        <div class="brand-text">
          <h1>موقع مختار الشعابي (الجمل)</h1>
          <p>تعز • مشرعة وحدنان • المسنح</p>
        </div>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <article class="post" id="postContainer"></article>

      <section class="section alt">
        <div class="section-head">
          <h2>أخبار ذات صلة</h2>
          <p>محتوى من نفس القسم لتسهيل التصفح.</p>
        </div>
        <div class="grid" id="relatedGrid"></div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© <span id="year"></span> موقع مختار الشعابي (الجمل)</p>
    </div>
  </footer>

  <div class="page-transition" id="pageTransition" aria-hidden="true"></div>
  <script src="assets/js/post.js"></script>
</body>
</html>
